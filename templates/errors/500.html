{% extends 'base.html' %}
{% load static %}

{% block title %}Server Error (500) — AQUAVERA{% endblock %}

{% block content %}
<section class="py-5 text-center" style="background-color: var(--aquavera-white-soft);">
    <div class="container py-5">
        <div class="max-w-500 mx-auto bg-white p-5 rounded-4 border shadow-sm">
            <div class="text-danger fs-1 mb-3"><i class="bi bi-exclamation-octagon"></i></div>
            <h1 class="display-4 fw-bold text-navy mb-2">500</h1>
            <h4 class="fw-bold mb-3">Server Error</h4>
            <p class="text-secondary small mb-4">
                We encountered an unexpected condition while processing your request. Our technical team has been notified.
            </p>
            <a href="{% url 'pages:home' %}" class="btn btn-aquavera">
                Return to Home
            </a>
        </div>
    </div>
</section>
{% endblock %}
