{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password — AQUAVERA{% endblock %}

{% block content %}
<section class="py-5" style="background-color: var(--aquavera-white-soft);">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
                    <h3 class="fw-bold mb-2">Reset Password</h3>
                    <p class="text-secondary small mb-4">Enter your registered email address to receive password reset instructions.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <input type="email" name="email" class="form-control" required placeholder="name@example.com">
                        </div>
                        <button type="submit" class="btn btn-aquavera w-100 py-2 justify-content-center">
                            Send Reset Link
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top small">
                        <a href="{% url 'accounts:login' %}" class="text-muted text-decoration-none">&laquo; Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
