{% extends 'base.html' %}

{% block title %}Password Reset Complete — AQUAVERA{% endblock %}

{% block content %}
<section class="py-5" style="background-color: var(--aquavera-white-soft);">
    <div class="container py-4 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="bg-white p-5 rounded-4 border shadow-sm">
                    <i class="bi bi-shield-check text-success fs-1 mb-3 d-block"></i>
                    <h3 class="fw-bold mb-2">Password Changed!</h3>
                    <p class="text-secondary small mb-4">
                        Your password has been reset successfully. You can now log in with your new credentials.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-aquavera px-4">
                        Sign In Now
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
