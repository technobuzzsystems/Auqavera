{% extends 'base.html' %}

{% block title %}Reset Email Sent — AQUAVERA{% endblock %}

{% block content %}
<section class="py-5" style="background-color: var(--aquavera-white-soft);">
    <div class="container py-4 text-center">
        <div class="row justify-content-center">
            <div class="col-lg-5 col-md-7">
                <div class="bg-white p-5 rounded-4 border shadow-sm">
                    <i class="bi bi-envelope-check text-info fs-1 mb-3 d-block"></i>
                    <h3 class="fw-bold mb-2">Check Your Inbox</h3>
                    <p class="text-secondary small mb-4">
                        If an account exists with that email address, password reset instructions have been sent (logged to console in development mode).
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-sm btn-aquavera-navy">
                        Return to Sign In
                    </a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
